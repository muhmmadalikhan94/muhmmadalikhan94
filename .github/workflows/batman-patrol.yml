name: Batman patrol

on:
  schedule:
    - cron: "0 0 * * *"   # every night at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/batman-patrol.yml"]

permissions:
  contents: write

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Draw the patrol over the contribution graph
        run: node scripts/batman-patrol.mjs ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the new SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/batman-patrol.svg
          git diff --cached --quiet || (git commit -m "Update Batman patrol [skip ci]" && git push)
